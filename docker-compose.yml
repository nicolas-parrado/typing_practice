version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    volumes:
      - backend_data:/app/data
    environment:
      - DB_PATH=/app/data/typing.db
      - PORT=8081
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8082:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
